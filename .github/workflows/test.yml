name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model and contract tests
        run: |
          for t in test/*.test.js; do
            node "$t"
          done
